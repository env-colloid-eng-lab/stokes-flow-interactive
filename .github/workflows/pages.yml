# Publish only the files the site needs (index.html, pages/, src/, vendor/) to GitHub Pages.
# reference/ (Julia labs), docs/, scripts/ and test/ stay in the repository and are not served.
# Settings -> Pages -> Source must be "GitHub Actions".
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Collect the site files
        run: |
          mkdir _site
          cp -r index.html pages src vendor .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
